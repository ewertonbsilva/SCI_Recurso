services:
  # Backend API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sci_api_prod
    restart: always
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=host.docker.internal
      - DB_NAME=${DB_NAME:-sci_recurso}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-Gabinete@193}
      - DB_PORT=3306
      - PORT=3001
      - VITE_API_URL=http://localhost:3001
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - sci_prod_network
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (React with Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sci_frontend_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sci_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sci_prod_network:
    driver: bridge
